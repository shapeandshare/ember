AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ember model cache — a retained S3 bucket that holds model weights for
  AWS GPU deployments. Stack name: ember-model-cache.

Resources:

  CacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ember-model-cache-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  CacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CacheBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::ember-model-cache-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:aws:s3:::ember-model-cache-${AWS::AccountId}-${AWS::Region}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

Outputs:

  BucketName:
    Description: Name of the ember model cache bucket
    Value: !Ref CacheBucket
