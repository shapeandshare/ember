<nav class="docs-nav" aria-label="Documentation">
  <span class="docs-nav-home">Documentation</span>
  <ul>
    {%- for doc in site.data.docs %}
    {%- assign durl = '/docs/' | append: doc.slug | append: '/' %}
    <li><a href="{{ durl | relative_url }}"{% if page.url == durl %} aria-current="page"{% endif %}>{{ doc.title }}</a></li>
    {%- endfor %}
    <li><a href="{{ '/results/' | relative_url }}">Benchmark leaderboard</a></li>
  </ul>
</nav>
