<header class="site-head">
  <div class="site-head-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-mark" src="{{ '/assets/brand/svg/ember-auto.svg' | relative_url }}" alt="" width="28" height="28">
      <span class="brand-name">ember</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/docs/' | relative_url }}">Docs</a>
      {%- assign bench_home = site.data.benchmark.sections[0].anchor | default: "summary" %}
      <a href="{{ '/results/' | append: bench_home | append: '/' | relative_url }}">Benchmark</a>
      <a href="{{ site.github }}">GitHub</a>
      <button id="theme" class="theme-toggle" type="button" aria-label="Colour theme">Auto</button>
    </nav>
  </div>
</header>
