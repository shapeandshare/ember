<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/svg/ember-auto.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/brand/tokens.css' | relative_url }}">
<style>{% include site.css %}</style>
{% if page.layout == 'benchmark' or page.layout == 'benchmark-index' %}<link rel="stylesheet" href="{{ '/assets/benchmark.css' | relative_url }}">{% endif %}
