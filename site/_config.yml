title: ember
tagline: Give your agent a gut feeling.
description: >-
  A gut feeling for coding agents. ember helps AI coding assistants know when
  to go ahead and when to check with you, running on your Mac or on a server.
  It advises; the agent decides.
url: "https://shapeandshare.github.io"
github: "https://github.com/shapeandshare/ember"

# `baseurl` is intentionally absent: CI passes --baseurl explicitly and every
# internal link uses relative_url. See the org pattern (darkharbour spec 059).

collections:
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      type: docs
    values:
      layout: doc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gems # make site-serve's gem cache; excluding it keeps Jekyll's polling off it
