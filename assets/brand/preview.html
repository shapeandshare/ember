<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember brand</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ember-surface);color:var(--ember-text);font:16px system-ui}main{max-width:1200px;margin:auto;padding:32px}h1{font-size:32px}p{color:var(--ember-muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:1px solid var(--ember-border);border-radius:24px;overflow:hidden}.panel img{width:100%;display:block}.light{background:#fff8eb}.dark{background:#201922}.mascot{height:320px;object-fit:contain}.palette{display:flex;gap:16px;flex-wrap:wrap;margin:32px 0}.swatch{width:120px;height:70px;border-radius:12px;border:1px solid var(--ember-border)}button{background:var(--ember-surface);color:var(--ember-accent);border:1px solid var(--ember-border);padding:10px 18px;border-radius:10px;cursor:pointer}a{color:var(--ember-accent)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<main><h1>Ember brand</h1><p>Give your agent a gut feeling.</p>
<button onclick="document.documentElement.dataset.theme='light'">Light</button>
<button onclick="document.documentElement.dataset.theme='dark'">Dark</button>
<button onclick="delete document.documentElement.dataset.theme">System</button>
<div class="palette">
<div><div class="swatch" style="background:#603050"></div>Plum · #603050</div>
<div><div class="swatch" style="background:#D65E64"></div>Coral · #D65E64</div>
<div><div class="swatch" style="background:#FFC24D"></div>Gold · #FFC24D</div>
<div><div class="swatch" style="background:#FFF8EB"></div>Cream · #FFF8EB</div>
<div><div class="swatch" style="background:#201922"></div>Ink · #201922</div>
</div>
<div class="grid"><div class="panel light"><img src="hero-light.svg" alt="Ember light banner"><img class="mascot" src="svg/ember-light.svg" alt="Ember on cream"></div><div class="panel dark"><img src="hero-dark.svg" alt="Ember dark banner"><img class="mascot" src="svg/ember-dark.svg" alt="Ember on dark plum"></div></div>
<p><a href="README.md">Asset and theme guide</a> · <a href="svg/preview.html">Alternate mascot archive</a></p></main>
</html>
