<!doctype html><html lang="en"><meta charset="utf-8"><title>Gut Feeling mascots</title><style>body{margin:0;font:17px system-ui;background:#ece6e0;color:#301c35}h1,h2{margin:24px}main{display:grid;grid-template-columns:repeat(3,1fr)}section{text-align:center;padding:16px}img{width:100%;height:340px;object-fit:contain}.light{background:#fff8eb}.dark{background:#201922;color:#eedbea}.check{background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/24px 24px}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>Gut Feeling mascot family</h1><h2>Mellow</h2><main><section class="light">Light<img src="mellow-light.svg" alt="mellow light"></section><section class="dark">Dark<img src="mellow-dark.svg" alt="mellow dark"></section><section class="check">Transparent / automatic<img src="mellow-auto.svg" alt="mellow automatic"></section></main><h2>Ember</h2><main><section class="light">Light<img src="ember-light.svg" alt="ember light"></section><section class="dark">Dark<img src="ember-dark.svg" alt="ember dark"></section><section class="check">Transparent / automatic<img src="ember-auto.svg" alt="ember automatic"></section></main><h2>Float</h2><main><section class="light">Light<img src="float-light.svg" alt="float light"></section><section class="dark">Dark<img src="float-dark.svg" alt="float dark"></section><section class="check">Transparent / automatic<img src="float-auto.svg" alt="float automatic"></section></main>
