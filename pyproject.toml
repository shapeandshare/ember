[project]
name = "ember-advise"
version = "0.10.3"
description = "A local gut feeling for coding agents: calibrated advice over MCP from Cloudflare's Clef model on Apple Silicon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "shapeandshare" }]
keywords = ["ember", "mcp", "opencode", "coding-agents", "apple-silicon", "mps", "clef"]
classifiers = [
    "Environment :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "transformers>=5.18,<6",
    "safetensors>=0.8,<1",
    "huggingface-hub>=1.33,<3",
    "accelerate>=1.15,<2",
    "pillow>=12,<13",
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    # boto3 downloads the model named by EMBER_MODEL_S3_URI for a hosted
    # deployment (ember/serving/hosted.py, ember/cfg/s3.py).
    "boto3>=1.40,<2",
]

[project.urls]
Repository = "https://github.com/shapeandshare/ember"

[project.scripts]
ember = "ember.cli:main"
gut = "ember.cli:main"
ember-advise = "ember.cli:main"
ember-mcp = "ember.mcp.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember"]

# The sdist ships the package, not the repository (benchmark data, site, vault).
[tool.hatch.build.targets.sdist]
include = ["/ember", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyyaml>=6",
    "ruff>=0.9",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "commitizen>=4.0",
    "boto3-stubs[s3]>=1.43.109",
    # outerbounds is the CLI used to run `outerbounds app deploy` for the
    # Outerbounds hosted-deployment contract (deployment/flash.yaml, full.yaml,
    # deployment/README.md). It is a contributor-machine deploy tool only —
    # never imported by ember itself, never used in CI, never present on the
    # deployed pod (see deployment/requirements.txt, generated separately).
    "outerbounds>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads the Clef model (slow; needs MPS or CPU)",
    "evals: calibration eval suite — positive and negative recipe cases (implies model)",
]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["ember"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "PT", "RUF", "D"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Article X's docstring rule applies to `ember/`; tests and scripts are exempt.
"tests/**" = ["S101", "S105", "S106", "D"]
"scripts/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["ember"]
untyped_calls_exclude = ["transformers"]

[[tool.mypy.overrides]]
module = [
    "huggingface_hub.*",
    "transformers.*",
    "torch.*",
    "torchvision.*",
    "accelerate.*",
    "safetensors.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.bandit]
targets = ["ember"]
skips = [
    "B101",  # assert_used — fine in test helpers
    "B603",  # subprocess_without_shell_equals_true — CLI wraps known binaries
    "B607",  # start_process_with_partial_path — CLI uses PATH resolution intentionally
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
# Files that carry the release version; each bump rewrites them, and
# tests/test_distribution.py keeps the list complete.
version_files = [
    "README.md:shapeandshare/ember@v",
    "site/index.md:shapeandshare/ember@v",
    "server.json:\"version\"",
    "packages/claude-plugin/.claude-plugin/plugin.json:\"version\"",
]
update_changelog_on_bump = true
major_version_zero = true
tag_format = "v$version"
# The retired opencode plugin release series (plugin/v0.2.0 … plugin/v0.4.0).
ignored_tag_formats = ["plugin/v$version"]
bump_message = "release v$new_version"
changelog_incremental = true
changelog_file = "CHANGELOG.md"

[tool.coverage.run]
source = ["ember"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 81
show_missing = true
