[project]
name = "clef-local"
version = "0.1.0"
description = "Run Cloudflare Clef decision models locally on Apple Silicon (MPS) and expose them to agents over MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "gut-feeling" }]
keywords = ["mcp", "opencode", "apple-silicon", "mps", "decision-model", "clef"]
classifiers = [
    "Environment :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "transformers>=5.18,<6",
    "safetensors>=0.8,<1",
    "huggingface-hub>=1.33,<2",
    "accelerate>=1.15,<2",
    "pillow>=12,<13",
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/shapeandshare/gut-feeling"

[project.scripts]
clef = "clef_local.cli:main"
clef-mcp = "clef_local.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clef_local"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads a Clef model (slow; needs MPS or CPU)",
]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
]
