# conda/lock-environment.yml — dependency-only source spec for the committed lock.
#
# `ember-advise` is deliberately NOT listed here: it cannot be locked against its own
# unbuilt conda-forge package. The release smoke installs `ember-advise==<version>`
# from conda-forge on top of this locked environment.
#
# The dependency set pins the newest co-installable stack conda-forge offers for
# Python 3.12 (approved divergence, constitution v3.4.0): pytorch 2.12/2.13,
# torchvision 0.27/0.28, huggingface_hub 1.32.0. Retired when conda-forge catches up.
#
# Regenerate with `make conda-lock`; verify with `make conda-lock-check`; never
# hand-edit `conda/ember-deps.conda-lock.yml`.

channels:
  - conda-forge

platforms:
  - osx-arm64
  - linux-64

dependencies:
  - python=3.12
  - pytorch >=2.12,<2.14
  - torchvision >=0.27,<0.29
  - transformers >=5.18,<6
  - safetensors >=0.8,<1
  - huggingface_hub >=1.32,<2
  - accelerate >=1.15,<2
  - pillow >=12,<13
  - fastapi >=0.142,<1
  - uvicorn-standard >=0.54,<1
  - pydantic >=2.13,<3
  - mcp >=2.3,<3
  - httpx >=0.28,<1
  - prometheus_client >=0.21,<1
  - boto3 >=1.40,<2
