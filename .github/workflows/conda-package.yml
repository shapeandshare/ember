# Build and publish per-release conda packages for the interim Anaconda.org channel.
#
# conda-forge is the long-term door (its feedstock is under review). Until it lands, releases
# are also published to the `joshburt` channel on Anaconda.org. Anaconda.org has no OIDC, so
# publishing needs a stored credential: the org-level `ANACONDA_TOKEN` secret (exposed to this
# repo), read only by the `publish` job and handed to anaconda-client as its native
# `ANACONDA_API_TOKEN`. (`prefix.dev` — OIDC, no stored secret — was rejected: a URL channel too
# undiscoverable for a public tool.) Retire this workflow when the conda-forge feedstock lands.
#
# Trigger: `release-ember.yml` dispatches this workflow (version + publish) after PyPI, because
# a release created with GITHUB_TOKEN does not fire the `release` event here; the `release`
# trigger stays for a release a person makes in the UI. `build` always runs; `publish` uploads
# only on a release event or when `publish` is requested.
#
# rattler-build is fetched directly (pinned release asset + sha256) instead of through
# prefix-dev/rattler-build-action: the repository's Actions allow-list permits only GitHub-owned
# actions and four named publishers, and that action is not among them.
#
# `conda/recipe.yaml` is a frozen conda-forge snapshot; each run renders it for the released
# version (scripts/render_conda_recipe.py) before building.

name: Conda package (Anaconda.org)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: ember-advise version to build (default is the triggering release)
        required: false
      publish:
        description: Upload the built packages to Anaconda.org
        type: boolean
        default: false

permissions: {}

concurrency:
  group: conda-package
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: osx-arm64
            rattler_asset: rattler-build-aarch64-apple-darwin
            rattler_sha256: 7648599c714465a806b87b79bd472242ac5143ae4df3796fdb8dc712d9e040f4
          - os: ubuntu-latest
            platform: linux-64
            rattler_asset: rattler-build-x86_64-unknown-linux-musl
            rattler_sha256: 09182ae841bd803435c8ed34017811522d18a709bb727bb8e31241119562ca60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="${RELEASE_TAG#v}"
          fi
          if [ -z "$version" ]; then
            echo "no version resolved — workflow_dispatch needs a version input" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Render the recipe for this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/render_conda_recipe.py "$VERSION" "$RUNNER_TEMP/recipe.yaml"

      - name: Install rattler-build (pinned release asset, sha256-verified)
        env:
          VERSION: v0.68.0
          ASSET: ${{ matrix.rattler_asset }}
          SHA256: ${{ matrix.rattler_sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rattler-build" \
            "https://github.com/prefix-dev/rattler-build/releases/download/${VERSION}/${ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${SHA256}  $RUNNER_TEMP/rattler-build" | sha256sum -c -
          else
            echo "${SHA256}  $RUNNER_TEMP/rattler-build" | shasum -a 256 -c -
          fi
          chmod +x "$RUNNER_TEMP/rattler-build"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build the conda package
        run: rattler-build build --recipe "$RUNNER_TEMP/recipe.yaml" --channel conda-forge

      - name: Upload the built package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: output/**/*.conda
          if-no-files-found: error

  publish:
    name: publish (Anaconda.org)
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install anaconda-client
        run: pip install "anaconda-client==1.15.0"

      - name: Download the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conda-*
          path: dist
          merge-multiple: true

      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: python3 scripts/upload_conda_packages.py dist --user joshburt
