# Build per-release conda packages for the interim Anaconda.org channel.
#
# conda-forge is the long-term door (its feedstock is under review). Until it lands, releases
# are also published to the `shapeandshare` channel on Anaconda.org. Anaconda.org has no OIDC,
# so publishing is a deliberate manual step with a locally-held token — no credential is stored
# in this repository. Download a run's `conda-<platform>` artifacts, then:
#
#     anaconda upload --user shapeandshare ember-advise-<version>-<build>.conda
#
# `conda/recipe.yaml` is a frozen conda-forge snapshot; each run renders it for the released
# version (scripts/render_conda_recipe.py) before building.

name: Conda package (Anaconda.org)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: ember-advise version to build (default is the triggering release)
        required: false

permissions: {}

concurrency:
  group: conda-package
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: osx-arm64
          - os: ubuntu-latest
            platform: linux-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="${RELEASE_TAG#v}"
          fi
          if [ -z "$version" ]; then
            echo "no version resolved — workflow_dispatch needs a version input" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Render the recipe for this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/render_conda_recipe.py "$VERSION" "$RUNNER_TEMP/recipe.yaml"

      - name: Build the conda package (artifact: conda-${{ matrix.platform }})
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: ${{ runner.temp }}/recipe.yaml
          build-args: --channel conda-forge
          artifact-name: conda-${{ matrix.platform }}
