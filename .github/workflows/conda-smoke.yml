# No-model conda release smoke (specs/008-conda-release).
#
# Verifies a released `ember-advise` installs from conda-forge on top of the
# committed dependency lock and runs, **without ever starting the model**
# (contract: specs/008-conda-release/contracts/smoke.md). Making a release starts
# the model zero times; the one-time model-backed verification is manual.
#
# Triggers: on demand (a version, defaulting to the latest GitHub release) and
# weekly against the latest release. conda-forge's version bot can lag a release,
# so the smoke retries the install step before failing.
#
# micromamba, conda-lock, and PyYAML are installed directly (pinned, sha256-verified) instead of
# through mamba-org/setup-micromamba: the repository's Actions allow-list permits only
# GitHub-owned actions and four named publishers, and that action is not among them.

name: Conda smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: ember-advise version to smoke test (default is the latest release)
        required: false
  schedule:
    - cron: "0 7 * * 1"

permissions: {}

concurrency:
  group: conda-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: conda smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: osx-arm64
            mamba_asset: micromamba-osx-arm64
            mamba_sha256: ec2a072f028e1a7cf20f3e2e74d5a8127cf5a5f27636375b5359811565f4e5be
          - os: ubuntu-latest
            platform: linux-64
            mamba_asset: micromamba-linux-64
            mamba_sha256: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Provide conda-lock, PyYAML, and micromamba (all pinned)
        env:
          MAMBA_VERSION: 2.9.0-0
          MAMBA_ASSET: ${{ matrix.mamba_asset }}
          MAMBA_SHA256: ${{ matrix.mamba_sha256 }}
        run: |
          pip install conda-lock pyyaml
          curl -fsSL -o "$RUNNER_TEMP/micromamba" \
            "https://github.com/mamba-org/micromamba-releases/releases/download/${MAMBA_VERSION}/${MAMBA_ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${MAMBA_SHA256}  $RUNNER_TEMP/micromamba" | sha256sum -c -
          else
            echo "${MAMBA_SHA256}  $RUNNER_TEMP/micromamba" | shasum -a 256 -c -
          fi
          chmod +x "$RUNNER_TEMP/micromamba"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(gh release view --json tagName --jq .tagName | sed 's/^v//')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Not `make conda-lock-check`: that target pulls the project venv in via `uv sync`, which
      # this job (no uv, and it tests the conda install rather than the checkout) neither has nor
      # needs. The script is the same single implementation the target wraps.
      - name: Verify the committed lock
        run: python scripts/freeze_conda_lock.py --check

      - name: Smoke the release (retry while conda-forge catches up)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if make PY=python conda-smoke VERSION="$VERSION"; then
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 120s" >&2
            sleep 120
          done
          echo "conda smoke failed after 6 attempts" >&2
          exit 1
