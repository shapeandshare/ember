# Release automation — opencode plugin (plugin/v* tags, no wheel).
#
# Triggers on every push to main that touches packages/opencode-plugin/**.
# The workflow-level paths filter is the isolation mechanism; no per-job if:
# needed.
#
# Flow:
#   1. Compute the next semver from conventional commits since the last
#      plugin/v* tag. Only feat (→ minor) and fix/perf/refactor/revert
#      (→ patch) commits request a release; docs/chore/test/ci/style/build
#      changes accumulate until a release-worthy commit arrives.
#   2. Write the new version into package.json; prepend a grouped
#      CHANGELOG entry.
#   3. Push the bump branch (no tag yet); open a PR with auto-merge, or
#      reuse the open PR from a previous attempt (rerun-safe).
#   4. Wait for the PR to actually merge (10 min). If checks await a
#      maintainer's approval (public-repo contributor gate), the wait says
#      so; approving and dispatching the workflow resumes cleanly.
#   5. Only after the merge: verify the merged version, tag the merged
#      commit, push the tag, create the GitHub Release with index.js +
#      package.json as assets.
#
# Tagging only after the merge means a blocked or closed bump PR leaves no
# tag behind — nothing to clean up, no orphaned release. If a run finds
# that main already carries a version newer than the last tag (a previous
# bump PR merged but its release failed), it skips the bump/PR/wait and
# goes straight to tagging and publishing.
#
# Loop prevention: bump commits are filtered from the scan by subject
# ("release plugin/v*", "release v*"), so even a merge that does trigger
# this workflow (paths match) finds no release-worthy commits and skips.
# (GitHub also does not start runs from GITHUB_TOKEN-initiated merges.)
#
# Security posture (per AGENTS.md):
#   - All uses: pinned to full commit SHAs with # vX.Y.Z comments.
#   - permissions: {} at workflow level; each job grants only what it needs.
#   - checkout uses persist-credentials: false throughout.
#   - No pull_request_target, workflow_run, or self-hosted runners.
#   - No stored secrets beyond GITHUB_TOKEN (auto-provisioned per run).
#   - zizmor audits this file on every PR touching .github/** (ci.yml).

name: Release plugin

on:
  push:
    branches: [main]
    paths:
      - "packages/opencode-plugin/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release-plugin:
    name: plugin — bump, PR, merge, tag, release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next plugin version from conventional commits
        id: bump
        run: |
          LAST_TAG=$(git tag --list 'plugin/v*' --sort=-version:refname | head -1)

          git fetch origin main --quiet
          MAIN_VERSION=$(git show origin/main:packages/opencode-plugin/package.json \
            | node -e "const pkg = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.stdout.write(pkg.version);")

          # A previous attempt may have merged its bump PR but failed before
          # tagging (for example, when checks awaited maintainer approval and
          # timed out). If main's version differs from the latest tag's, resume
          # at the tag step instead of bumping again.
          if [ -n "$LAST_TAG" ]; then
            TAG_VERSION=$(git show "${LAST_TAG}:packages/opencode-plugin/package.json" \
              | node -e "const pkg = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.stdout.write(pkg.version);")
            if [ "$MAIN_VERSION" != "$TAG_VERSION" ]; then
              echo "main carries ${MAIN_VERSION} while ${LAST_TAG} carries ${TAG_VERSION} — resuming at the tag step."
              echo "landed=true" >> "$GITHUB_OUTPUT"
              echo "tag=plugin/v${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
              echo "branch=ci/bump-plugin-v${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
              echo "new_version=${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "landed=false" >> "$GITHUB_OUTPUT"

          CURRENT=$(node -p "require('./packages/opencode-plugin/package.json').version")

          if [ -z "$LAST_TAG" ]; then
            # No plugin tag exists yet — scan all history for plugin-touching commits.
            RAW_COMMITS=$(git log HEAD --pretty=format:"%s" \
              -- packages/opencode-plugin/ 2>/dev/null || true)
          else
            RAW_COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" \
              -- packages/opencode-plugin/ 2>/dev/null || true)
          fi

          # Strip bump commits (subjects starting with "release plugin/v" or "release v").
          # These are generated by the release workflows themselves and must never
          # trigger another bump cycle.
          COMMITS=$(printf '%s\n' "$RAW_COMMITS" | grep -v '^release plugin/v' | grep -v '^release v' || true)

          if [ -z "$COMMITS" ]; then
            echo "No commits touching packages/opencode-plugin/ since ${LAST_TAG:-<root>} — skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only feat (minor) and fix/perf/refactor/revert (patch) request a
          # release; breaking changes bump minor while major stays 0.
          BUMP_TYPE=""
          while IFS= read -r subject; do
            if echo "$subject" | grep -qE '!:|BREAKING CHANGE'; then
              BUMP_TYPE="minor"
              break
            elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP_TYPE="minor"
            elif [ -z "$BUMP_TYPE" ] && \
                echo "$subject" | grep -qE '^(fix|perf|refactor|revert)(\([^)]*\))?:'; then
              BUMP_TYPE="patch"
            fi
          done <<< "$COMMITS"

          if [ -z "$BUMP_TYPE" ]; then
            echo "Only non-release commits (docs/chore/test/ci/style/build) since ${LAST_TAG:-<root>} — skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP_TYPE" in
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          printf '%s\n' "$COMMITS" > /tmp/plugin-commits.txt
          echo "bump_type=${BUMP_TYPE}"     >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=plugin/v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=ci/bump-plugin-v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip remaining steps if no bump needed
        id: check
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -z "$BUMP_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write new version into package.json
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/opencode-plugin/package.json', 'utf8'));
            pkg.version = process.env.NEW_VERSION;
            fs.writeFileSync('packages/opencode-plugin/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Prepend CHANGELOG entry for plugin
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## ${BUMP_TAG} (${DATE})"
            echo ""
            FEATS=$(grep -E '^feat' /tmp/plugin-commits.txt || true)
            if [ -n "$FEATS" ]; then
              echo "### Feat"
              echo ""
              printf '%s\n' "$FEATS" | sed 's/^/- /'
              echo ""
            fi
            FIXES=$(grep -E '^(fix|perf|refactor|revert)' /tmp/plugin-commits.txt || true)
            if [ -n "$FIXES" ]; then
              echo "### Fix"
              echo ""
              printf '%s\n' "$FIXES" | sed 's/^/- /'
              echo ""
            fi
            MISC=$(grep -vE '^(feat|fix|perf|refactor|revert)' /tmp/plugin-commits.txt || true)
            if [ -n "$MISC" ]; then
              echo "### Miscellaneous"
              echo ""
              printf '%s\n' "$MISC" | sed 's/^/- /'
              echo ""
            fi
          } > /tmp/new-entry.md
          awk '
            /<!-- next-version -->/ {
              print
              while ((getline line < "/tmp/new-entry.md") > 0) print line
              next
            }
            { print }
          ' packages/opencode-plugin/CHANGELOG.md > /tmp/cl-merged.md
          mv /tmp/cl-merged.md packages/opencode-plugin/CHANGELOG.md

      - name: Commit and push bump branch (no tag yet)
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git add packages/opencode-plugin/package.json \
                  packages/opencode-plugin/CHANGELOG.md
          git commit -m "release ${BUMP_TAG}"
          # --force so a rerun after a blocked attempt reuses the branch.
          git push --force origin "HEAD:refs/heads/${BUMP_BRANCH}"

      - name: Open or reuse bump PR and enable auto-merge
        id: pr
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          PR_URL=$(gh pr list --head "${BUMP_BRANCH}" --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "release ${BUMP_TAG}" \
              --body "Automated opencode plugin version bump to ${BUMP_TAG}. Auto-merges when CI passes." \
              --base main \
              --head "${BUMP_BRANCH}")
            echo "Opened: ${PR_URL}"
          else
            echo "Reusing open PR: ${PR_URL}"
          fi
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          gh pr merge "${PR_URL}" --auto --squash || \
            echo "Auto-merge already enabled."

      - name: Wait for the bump PR to merge (up to 10 min)
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          for i in $(seq 1 20); do
            STATE=$(gh pr view "${PR_URL}" --json state --jq .state 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "Bump PR merged after ${i} poll(s)."
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Bump PR for ${BUMP_TAG} was closed without merging — aborting." >&2
              exit 1
            fi
            MERGE_STATE=$(gh pr view "${PR_URL}" --json mergeStateStatus \
              --jq .mergeStateStatus 2>/dev/null || echo "")
            if [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "Bump branch is behind main — updating it."
              gh pr update-branch "${PR_URL}" >/dev/null 2>&1 || true
            fi
            if [ $((i % 5)) -eq 0 ]; then
              WAITING=$(gh run list --commit "${HEAD_SHA}" --json conclusion \
                --jq '[.[] | select(.conclusion == "action_required")] | length' \
                2>/dev/null || echo 0)
              if [ "$WAITING" != "0" ]; then
                echo "Note: ${WAITING} check run(s) still await maintainer approval."
              fi
            fi
            if [ "$i" -eq 20 ]; then
              echo "Timed out waiting for ${BUMP_TAG}'s bump PR to merge." >&2
              echo "If checks await approval, approve them in the Actions tab; once the bump PR" >&2
              echo "merges, dispatch this workflow again (make release-plugin). It detects the" >&2
              echo "already-merged version and goes straight to tagging and publishing." >&2
              echo "No tag was created." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Tag the merged commit and push the tag
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git fetch origin main --quiet
          # Build, notes, and assets all come from the merged tree, whether this
          # run bumped, waited for a merge, or resumed after one.
          git reset --hard origin/main
          MERGED_VERSION=$(node -p "require('./packages/opencode-plugin/package.json').version")
          if [ "$MERGED_VERSION" != "$NEW_VERSION" ]; then
            echo "main has ${MERGED_VERSION}, expected ${NEW_VERSION} — aborting." >&2
            exit 1
          fi
          git tag -f -a -m "release ${BUMP_TAG}" "${BUMP_TAG}" origin/main
          git push origin "refs/tags/${BUMP_TAG}"

      - name: Extract release notes from plugin CHANGELOG
        if: steps.check.outputs.skip == 'false'
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          # Changelog headings carry a date suffix (`## plugin/v0.3.0 (2026-10-05)`),
          # so match on prefix rather than exact equality.
          awk -v tag="## ${BUMP_TAG}" '
            index($0, tag) == 1 { seen=1; next }
            seen && /^## / { exit }
            seen { print }
          ' packages/opencode-plugin/CHANGELOG.md > plugin-release-notes.md
          if [ ! -s plugin-release-notes.md ]; then
            echo "Release ${BUMP_TAG}." > plugin-release-notes.md
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            packages/opencode-plugin/index.js \
            packages/opencode-plugin/package.json \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file plugin-release-notes.md
