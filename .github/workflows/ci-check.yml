# CI — fast check gate
#
# STATUS: STUB — not yet enabled for automatic runs.
# To enable: change the `on:` block to trigger on push/pull_request.
# Pre-requisites before enabling:
#   1. Confirm `make lint`, `make typecheck`, `make security` pass locally
#   2. Add ruff, mypy, bandit to dev dependencies and run `uv sync --locked`
#   3. Verify matrix targets in this file match current Makefile targets
#
name: CI — Check

on:
  workflow_dispatch:   # manual trigger only until enabled
  # push:              # uncomment to enable on push
  #   branches: [main]
  # pull_request:      # uncomment to enable on PRs
  #   branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile + unit tests
    runs-on: macos-latest   # Apple Silicon hosted runner when available
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Compile
        run: make compile

      - name: Unit tests (no model)
        run: make test-fast

  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: mypy strict
        run: make typecheck

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Bandit
        run: make security

  gate-status:
    name: Gate status
    runs-on: ubuntu-latest
    needs: [check, lint, typecheck, security]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check all gates passed
        env:
          CHECK: ${{ needs.check.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          if [[ "$CHECK" != "success" || "$LINT" != "success" || \
                "$TYPECHECK" != "success" || "$SECURITY" != "success" ]]; then
            echo "One or more gates failed"
            exit 1
          fi
          echo "All gates passed"
