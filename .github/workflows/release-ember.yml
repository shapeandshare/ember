# Release automation — ember Python package (gut wheel, v* tags).
#
# Triggers on every push to main that touches ember/** or evals/**. The
# workflow-level paths filter is the isolation mechanism; no per-job if:
# is needed.
#
# Flow:
#   1. cz bump — bumps pyproject.toml + uv.lock, generates CHANGELOG, and
#      creates the local v* tag.
#   2. Push the bump branch (no tag yet); open a PR with auto-merge, or
#      reuse the open PR from a previous attempt (rerun-safe).
#   3. Wait for the PR to actually merge (10 min). If checks await a
#      maintainer's approval (public-repo contributor gate), the wait says
#      so; approving and dispatching the workflow resumes cleanly.
#   4. Only after the merge: verify the merged version, tag the merged
#      commit, push the tag, build wheel + sdist, create the GitHub Release.
#
# Resume path: if a run finds that main already carries a version newer
# than the last tag (a previous bump PR merged but its release failed), it
# skips the bump/PR/wait and goes straight to tagging and publishing.
#
# Tagging only after the merge means a blocked or closed bump PR leaves no
# tag behind — nothing to clean up, no orphaned release.
#
# Loop prevention: the bump commit changes pyproject.toml (version string),
# uv.lock, and CHANGELOG.md — none of those match ember/** or evals/**, so
# the bump never re-triggers this workflow. (GitHub also does not start
# runs from GITHUB_TOKEN-initiated merges; and the PR merges as a squashed
# commit subject to the same paths filter.)
#
# Security posture (per AGENTS.md):
#   - All uses: pinned to full commit SHAs with # vX.Y.Z comments.
#   - permissions: {} at workflow level; each job grants only what it needs.
#   - checkout uses persist-credentials: false throughout.
#   - No pull_request_target, workflow_run, or self-hosted runners.
#   - No stored secrets beyond GITHUB_TOKEN (auto-provisioned per run).
#   - zizmor audits this file on every PR touching .github/** (ci.yml).

name: Release ember

on:
  push:
    branches: [main]
    paths:
      - "ember/**"
      - "evals/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-ember
  cancel-in-progress: false

jobs:
  release-ember:
    name: ember — bump, PR, merge, tag, release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump ember version and generate changelog
        id: bump
        run: |
          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          git fetch origin main --quiet
          MAIN_VERSION=$(git show origin/main:pyproject.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)

          # A previous attempt may have merged its bump PR but failed before
          # tagging (for example, when checks awaited maintainer approval and
          # timed out). If main carries a version newer than the last release
          # tag, resume at the tag step instead of bumping again. (Tags can
          # point at pre-squash bump commits, so match by name like commitizen
          # does — git describe cannot see them from main.)
          if git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null \
              && [ "$MAIN_VERSION" != "$CURRENT" ]; then
            echo "main carries ${MAIN_VERSION} while v${CURRENT} is the last release — resuming at the tag step."
            echo "landed=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "branch=ci/bump-v${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "new_version=${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "landed=false" >> "$GITHUB_OUTPUT"

          if ! uv run cz bump --changelog --yes; then
            code=$?
            if [ "$code" -eq 21 ]; then
              echo "No releasable ember commits since last tag — skipping."
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$code"
          fi
          BUMP_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          echo "tag=${BUMP_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch=ci/bump-${BUMP_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${BUMP_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Skip remaining steps if no bump needed
        id: check
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -z "$BUMP_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push bump branch (no tag yet)
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          # --force so a rerun after a blocked attempt reuses the branch.
          git push --force origin "HEAD:refs/heads/${BUMP_BRANCH}"

      - name: Open or reuse bump PR and enable auto-merge
        id: pr
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          PR_URL=$(gh pr list --head "${BUMP_BRANCH}" --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "release ${BUMP_TAG}" \
              --body "Automated ember version bump to ${BUMP_TAG}. Auto-merges when CI passes." \
              --base main \
              --head "${BUMP_BRANCH}")
            echo "Opened: ${PR_URL}"
          else
            echo "Reusing open PR: ${PR_URL}"
          fi
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          gh pr merge "${PR_URL}" --auto --squash || \
            echo "Auto-merge already enabled."

      - name: Wait for the bump PR to merge (up to 10 min)
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          for i in $(seq 1 20); do
            STATE=$(gh pr view "${PR_URL}" --json state --jq .state 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "Bump PR merged after ${i} poll(s)."
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Bump PR for ${BUMP_TAG} was closed without merging — aborting." >&2
              exit 1
            fi
            if [ $((i % 5)) -eq 0 ]; then
              WAITING=$(gh run list --commit "${HEAD_SHA}" --json conclusion \
                --jq '[.[] | select(.conclusion == "action_required")] | length' \
                2>/dev/null || echo 0)
              if [ "$WAITING" != "0" ]; then
                echo "Note: ${WAITING} check run(s) still await maintainer approval."
              fi
            fi
            if [ "$i" -eq 20 ]; then
              echo "Timed out waiting for ${BUMP_TAG}'s bump PR to merge." >&2
              echo "If checks await approval, approve them in the Actions tab; once the bump PR" >&2
              echo "merges, dispatch this workflow again (make release-ember). It detects the" >&2
              echo "already-merged version and goes straight to tagging and publishing." >&2
              echo "No tag was created." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Tag the merged commit and push the tag
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git fetch origin main --quiet
          # Build, notes, and assets all come from the merged tree, whether this
          # run bumped, waited for a merge, or resumed after one.
          git reset --hard origin/main
          MERGED_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$MERGED_VERSION" != "$NEW_VERSION" ]; then
            echo "main has ${MERGED_VERSION}, expected ${NEW_VERSION} — aborting." >&2
            exit 1
          fi
          git tag -f -a -m "release ${BUMP_TAG}" "${BUMP_TAG}" origin/main
          git push origin "refs/tags/${BUMP_TAG}"

      - name: Build wheel and sdist
        if: steps.check.outputs.skip == 'false'
        run: uv build

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.skip == 'false'
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          awk -v tag="## ${BUMP_TAG}" '
            index($0, tag) == 1 { seen=1; next }
            seen && /^## / { exit }
            seen { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${BUMP_TAG}." > release-notes.md
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
