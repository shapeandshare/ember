name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: compile, unit tests, build, install smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make check
      - run: uv build
      - name: Install the wheel as a uv tool and smoke the CLI
        run: |
          uv tool install --python 3.12 dist/gut_feeling-*.whl
          bin="$(uv tool dir --bin)"
          "$bin/gut-feeling" --help
          "$bin/gut" --help
          "$bin/gut-feeling" model list
          "$bin/gut-feeling" agents show instructions | head -1
          test -x "$bin/gut-feeling-mcp"

  model:
    name: model-backed tests (self-hosted Apple Silicon)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make download
      - run: make test-strict
