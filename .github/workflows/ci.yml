name: ci

# Model-backed tests are not run in CI. The 9B fp16 model needs ~20 GB and even the
# org's self-hosted Apple Silicon VMs are provisioned with 8 GiB, so the server OOMs
# on MPS. Run `make test` locally for model-affecting changes. See
# vault/discoveries/2026-10-03-self-hosted-vms-cannot-hold-the-model.md.
#
# Pull requests from forks run this workflow with their own copy of it, so treat every
# job as running untrusted code: GitHub-hosted runners only, a read-only token that is
# never persisted to disk, and actions pinned to full commit SHAs (Dependabot bumps
# the pins). The zizmor job fails the build when a workflow drifts from this.
#
# This workflow mirrors `make pr-ready`: format, lint, typecheck, security, compile,
# unit tests, build, install smoke — all in parallel, all required to pass.
# Model-backed tests and coverage reporting run locally; see `make test-cov`.
#
# Runner strategy:
#   ubuntu-latest — lint, typecheck, security, unit tests (fast, cheap Linux)
#   macos-latest  — build wheel + install smoke only (MPS deps need macOS)
# Unit tests no longer require macOS; they run on Linux in the `test` job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ########################################################################
  # Format + lint (ruff — fast, runs on Linux)
  # ########################################################################
  lint:
    name: format + lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: make format
      - run: make lint

  # ########################################################################
  # Type checking (mypy --strict, runs on Linux)
  # ########################################################################
  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: make typecheck

  # ########################################################################
  # Security scan (bandit, runs on Linux)
  # ########################################################################
  security:
    name: security scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: make security

  # ########################################################################
  # Compile + unit tests (Linux — fast and cheap; no macOS needed for unit
  # tests since they do not load torch or exercise MPS paths)
  # ########################################################################
  test:
    name: compile, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: make check
      - name: Plugin config-hook tests (node)
        run: node --test packages/opencode-plugin/index.test.js

  # ########################################################################
  # Build wheel + install smoke (macOS — needed for torch/MPS dependencies
  # that the wheel bundles; separate from unit tests to avoid billing macOS
  # runner time for work that Linux handles cheaply)
  # ########################################################################
  smoke:
    name: build wheel, install smoke
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv build
      - name: Install the wheel as a uv tool and smoke the CLI
        run: |
          uv tool install --python 3.12 dist/gut-*.whl
          bin="$(uv tool dir --bin)"
          "$bin/ember" --help
          "$bin/gut" --help
          "$bin/ember" model list
          "$bin/ember" agents show instructions | head -1
          test -x "$bin/ember-mcp"

  # ########################################################################
  # SonarCloud scanning (unit tests + XML coverage → SonarCloud upload)
  # Runs on Linux; does not load the model (unit tests only). Needs the
  # SONAR_TOKEN repo secret (Settings → Secrets → Actions).
  # ########################################################################
  sonar:
    name: sonarcloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history lets SonarCloud compute blame and new-code periods correctly.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Run unit tests with coverage (XML)
        run: uv run pytest tests/ -m "not model and not evals" --cov=ember --cov-report=xml
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ########################################################################
  # Workflow security (zizmor — only needs Linux, only meaningful when
  # .github/** changes; still runs on every PR to catch drift)
  # ########################################################################
  zizmor:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1
