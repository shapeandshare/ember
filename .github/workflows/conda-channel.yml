# Interim self-hosted conda channel (prefix.dev) — specs/008-conda-release.
#
# conda-forge is the long-term door and its feedstock is under review; until it lands,
# each release is also published to the `shapeandshare` channel on prefix.dev.
#
# Publishing uses OIDC trusted publishing — no stored secrets — exactly like PyPI. The
# channel's "Trusted Publishers" settings must list this repository (shapeandshare/ember)
# and this workflow file (conda-channel.yml).
#
# `conda/recipe.yaml` is a frozen conda-forge submission snapshot; each run renders it
# for the released version (scripts/render_conda_recipe.py) before building, so the
# snapshot is never edited by a release.

name: Conda channel (prefix.dev)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: ember-advise version to publish (default is the triggering release)
        required: false

permissions: {}

concurrency:
  group: conda-channel
  cancel-in-progress: false

env:
  # The channel's canonical reference on prefix.dev (edit if the channel is not primary).
  PREFIX_CHANNEL: shapeandshare

jobs:
  publish:
    name: publish (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write        # OIDC token for prefix.dev trusted publishing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: osx-arm64
          - os: ubuntu-latest
            platform: linux-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="${RELEASE_TAG#v}"
          fi
          if [ -z "$version" ]; then
            echo "no version resolved — workflow_dispatch needs a version input" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Render the recipe for this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/render_conda_recipe.py "$VERSION" "$RUNNER_TEMP/recipe.yaml"

      - name: Build the conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: ${{ runner.temp }}/recipe.yaml
          build-args: --channel conda-forge

      - name: Upload to prefix.dev (OIDC, no token)
        shell: bash
        run: |
          shopt -s nullglob
          for pkg in output/**/*.conda; do
            rattler-build upload prefix -c "$PREFIX_CHANNEL" "$pkg"
          done
