sonar.organization=shapeandshare
sonar.projectKey=shapeandshare_ember

# Source and test paths
sonar.sources=ember
sonar.tests=tests
sonar.python.version=3.12

# Coverage report (generated by the sonar CI job via pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions — generated files, scripts, and vendor artifacts
sonar.exclusions=\
  scripts/**,\
  site/**,\
  benchmark/**,\
  evals/**,\
  packages/**,\
  vault/**,\
  assets/**,\
  **/__pycache__/**,\
  **/*.pyc

sonar.test.exclusions=tests/**
